name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spendwise
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spendwise
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spendwise_test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      DEMO_MODE: "true"
      DEFAULT_ORG_SLUG: acme
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile   # postinstall runs `prisma generate`

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate dev database
        run: pnpm db:deploy

      - name: Check the schema matches the migrations
        # Fails if prisma/schema.prisma and prisma/migrations have drifted apart.
        run: pnpm db:drift

      - name: Migrate test database
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/spendwise" -c "CREATE DATABASE spendwise_test;"
          DATABASE_URL="$TEST_DATABASE_URL" pnpm db:deploy

      - name: Seed
        run: pnpm db:seed

      - name: Unit and component tests
        run: pnpm test --ci

      - name: Integration tests
        run: pnpm test:integration --ci

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
